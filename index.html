<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 송년회 날짜 정하기</title>
<meta name="description" content="12월 중 안 되는 날만 콕콕 눌러주세요.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f3d2e">
<meta property="og:type" content="website">
<meta property="og:title" content="2026 송년회 날짜 정하기">
<meta property="og:description" content="12월 중 안 되는 날만 콕콕 눌러주세요.">
<meta property="og:url" content="https://jtl10231-oss.github.io/songnyeonhoe/">
<meta property="og:image" content="https://jtl10231-oss.github.io/songnyeonhoe/og.png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='8' width='56' height='52' rx='12' fill='%230f3d2e'/%3E%3Crect x='4' y='8' width='56' height='16' rx='8' fill='%23e5484d'/%3E%3Ctext x='32' y='52' font-size='24' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3E12%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1c1c1e;--sub:#6e6e73;--faint:#a3a3a8;--line:#e7e3dc;--soft:#f3f1ec;--pine:#0f3d2e;--red:#e5484d;--green:#1f9d55;--sun:#d93636;--sat:#2f6fdb;--gold:#e0a915}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(120px + env(safe-area-inset-bottom))}

.hero{position:relative;overflow:hidden;margin:0 -14px;padding:28px 22px 22px;color:#fff;background:radial-gradient(130% 140% at 100% 0%,#2b7b57 0%,#0f3d2e 58%,#0a2b20 100%);border-radius:0 0 26px 26px}
.flake{position:absolute;right:-22px;top:-20px;width:160px;height:160px;color:#fff;opacity:.12}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;color:#f3d36b}
.hero h1{margin:6px 0;font-size:27px;line-height:1.25;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;font-size:15px;opacity:.88}
.prog{margin-top:18px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;white-space:nowrap}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:#f3d36b;transition:width .5s ease}

.tabs{position:sticky;top:0;z-index:20;margin:0 -14px 4px;padding:12px 14px 8px;background:var(--bg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:#e8e4dc}
.seg button{height:42px;border-radius:11px;font-size:15px;font-weight:700;color:var(--sub)}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
#tabResult{display:flex;align-items:center;justify-content:center;gap:6px}
#tabResult[aria-selected="false"]{background:#f3d36b;color:#3d2c00;font-weight:800;box-shadow:0 2px 8px rgba(224,169,21,.45);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 2px 8px rgba(224,169,21,.35)}50%{box-shadow:0 2px 16px rgba(224,169,21,.8)}}
.cnt{padding:2px 7px;border-radius:99px;background:rgba(0,0,0,.12);font-size:12px;font-weight:800}
#tabResult[aria-selected="true"] .cnt{background:#e6f4ec;color:#17603a}
.golink{display:block;width:100%;height:50px;margin:4px 0 8px;border-radius:14px;background:#f3d36b;color:#3d2c00;font-size:16px;font-weight:800}

.err{margin:0 0 12px;padding:12px 14px;border-radius:12px;background:#fff4e5;color:#8a4b00;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.err button{font-weight:800;text-decoration:underline}
.card{background:var(--card);border-radius:18px;padding:18px 14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.step{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pine);color:#fff;font-size:12px;font-weight:800}
.hint{margin:0 0 14px;color:var(--sub);font-size:13.5px}
.muted{color:var(--faint);font-size:13.5px}

.names{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.name{position:relative;height:46px;border-radius:12px;background:var(--soft);font-size:15px;font-weight:700;transition:background .15s,color .15s}
.name.done{background:#e6f4ec;color:#17603a}
.name .ck{position:absolute;top:4px;right:6px;font-size:11px;line-height:1;color:var(--green)}
.name[aria-pressed="true"]{background:var(--pine);color:#fff;box-shadow:0 4px 10px rgba(15,61,46,.25)}
.name[aria-pressed="true"] .ck{color:#9be3b8}
@media (max-width:340px){.names{grid-template-columns:repeat(3,1fr)}}

.cal,.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.heat{gap:5px;margin-top:4px}
.dow{height:30px;border-radius:8px;font-size:13px;font-weight:700;color:var(--sub);display:grid;place-items:center}
button.dow{background:var(--soft)}
.dow.sun{color:var(--sun)}.dow.sat{color:var(--sat)}
.day,.hd{position:relative;min-width:0;aspect-ratio:1/1.08;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;transition:transform .08s}
.day{background:#fff;border:1.5px solid var(--line)}
.day:active,.hd:active{transform:scale(.93)}
.day .n,.hd .n{font-size:16px;line-height:1}
.day small,.hd small{font-size:10px;line-height:1;font-weight:700;color:var(--faint);white-space:nowrap}
.day.sun .n,.day.hol .n{color:var(--sun)}.day.sat .n{color:var(--sat)}
.day.hol small{color:var(--sun)}
.day.no{background:var(--red);border-color:var(--red);box-shadow:0 3px 8px rgba(229,72,77,.3)}
.day.no .n,.day.no small{color:#fff}
.cal.locked .day{opacity:.45}
.calfoot{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:14px;font-size:13.5px;color:var(--sub)}
.calfoot b{color:var(--ink)}
.link{color:var(--sub);font-size:13px;font-weight:700;text-decoration:underline;white-space:nowrap}
.tip{margin:10px 0 0;font-size:12.5px;color:var(--faint)}
.foot{margin:6px 4px;font-size:13px;color:var(--sub);text-align:center}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .25s ease}
.dock.show{transform:none}
.dock .in{max-width:532px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dock .who{flex:1;min-width:0;font-size:13px;color:var(--sub);line-height:1.3}
.dock .who b{display:block;font-size:15px;color:var(--ink)}
.btn{height:50px;padding:0 22px;border-radius:14px;font-size:16px;font-weight:800;white-space:nowrap}
.btn.primary{background:var(--pine);color:#fff}
.btn.primary:disabled{background:#cfd8d3;color:#fff;cursor:default}
.btn.soft{background:var(--soft)}
.btn.sm{height:40px;padding:0 14px;font-size:14px;border-radius:12px}

.big{display:flex;align-items:baseline;gap:6px;margin:10px 0 8px;font-size:15px;color:var(--sub);font-weight:700}
.big b{font-size:32px;line-height:1;color:var(--ink);font-weight:800}
.bar.dark{background:#ece8e1;height:10px}
.bar.dark i{background:var(--green)}
.sub-h{margin:16px 0 8px;font-size:13.5px;font-weight:800;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:99px;font-size:13.5px;font-weight:700;background:var(--soft)}
.chip.ok{background:#e6f4ec;color:#17603a}
.chip.ok em{font-style:normal;font-weight:600;font-size:11.5px;opacity:.75}
.chip.wait{background:#fdeceb;color:#b42318}
.btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.dowf{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:0 0 6px}
.dowf button{height:34px;border-radius:10px;font-size:13px;font-weight:800;background:var(--soft);color:var(--faint)}
.dowf button[aria-pressed="true"]{background:var(--pine);color:#fff}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid #f1eee8;cursor:pointer}
.rank li:first-child{border-top:0}
.rank li.empty{cursor:default;color:var(--faint);justify-content:center;padding:20px 0}
.rk{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--soft);color:var(--sub)}
.rank li.top .rk{background:var(--gold);color:#fff}
.rmain{flex:1;min-width:0}
.rd{font-size:16px;font-weight:800}
.rno{font-size:13px;color:var(--sub);margin-top:2px}
.rno.none{color:var(--green);font-weight:700}
.rok{flex:none;text-align:right;font-size:12px;color:var(--sub)}
.rok b{display:block;font-size:18px;color:var(--ink);line-height:1.1}
.tag{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:6px;background:#fdeceb;color:var(--sun);font-size:11px;font-weight:800;vertical-align:2px}
.more{display:block;width:100%;margin-top:6px;height:42px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:700;color:var(--sub)}

.hd{border:0}
.hd .n{font-size:15px}
.hd small{color:inherit;opacity:.92}
.lx{background:var(--soft);color:var(--faint)}
.l0{background:#1f9d55;color:#fff}
.l1{background:#78c48a;color:#0c3b1f}
.l2{background:#c5e3a1;color:#28451a}
.l3{background:#f6d774;color:#5a4300}
.l4{background:#f4a15d;color:#5b2a00}
.l5{background:#e5484d;color:#fff}
.hd.off{opacity:.25}
.hd.best::after{content:"★";position:absolute;top:3px;right:5px;font-size:10px;line-height:1;color:#ffe27a}
.hd.best.l1::after,.hd.best.l2::after,.hd.best.l3::after{color:#a86b00}
.hd.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:12px;font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.detail{margin-top:14px;padding:14px;border-radius:14px;background:#f7f5f1;font-size:14px}
.dt{font-size:16px;font-weight:800}
.dn{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.dn span{padding:4px 9px;border-radius:99px;font-size:12.5px;font-weight:800}
.dn .g{background:#e6f4ec;color:#17603a}.dn .r{background:#fdeceb;color:#b42318}.dn .w{background:#ece9e3;color:var(--sub)}
.dl{display:flex;gap:8px;margin-top:8px;line-height:1.55}
.dl b{flex:none;width:56px;color:var(--sub);font-size:12.5px;padding-top:1px}

details.mxd summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:800}
details.mxd summary::-webkit-details-marker{display:none}
details.mxd summary::after{content:"펼치기";font-size:13px;font-weight:700;color:var(--sub)}
details.mxd[open] summary::after{content:"접기"}
.mxwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px -14px 0;padding:0 14px 4px}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px}
.mx th,.mx td{min-width:26px;height:30px;padding:0 2px;text-align:center;border-bottom:1px solid #f1eee8;font-weight:700}
.mx th{font-size:12px;line-height:1.1;height:38px}
.mx th small{display:block;font-size:10px;color:var(--faint);font-weight:700}
.mx th.sun,.mx th.sun small{color:var(--sun)}.mx th.sat,.mx th.sat small{color:var(--sat)}
.mx .nm{position:sticky;left:0;z-index:2;min-width:74px;padding:0 8px 0 0;text-align:left;background:#fff;white-space:nowrap}
.mx td.x{background:var(--red);color:#fff;border-bottom-color:#fff}
.mx tr.pending td{color:var(--faint)}
.mx tr.pending td:not(.nm){background:repeating-linear-gradient(135deg,#f3f1ec 0 4px,#fff 4px 8px)}
.mx .nm small{font-size:10px;margin-left:3px;font-weight:600}
.mx tfoot td{border-bottom:0;height:32px}
.mx tfoot .nm{color:var(--sub)}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:70;max-width:88vw;padding:12px 18px;border-radius:14px;background:rgba(28,28,30,.94);color:#fff;font-size:14px;font-weight:700;text-align:center;opacity:0;transform:translate(-50%,12px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.42)}
.modal.show{display:flex}
.sheet{width:100%;max-width:560px;padding:22px 18px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#fff;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-size:19px;font-weight:800}
.sheet .body{margin:0 0 18px;color:var(--sub);font-size:14.5px}
.sheet textarea{width:100%;height:120px;margin:0 0 14px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13px;color:var(--ink)}
.sheet .row{display:flex;gap:8px}
.sheet .row .btn{flex:1}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:22px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <svg class="flake" viewBox="0 0 100 100" aria-hidden="true"><defs><g id="arm"><path d="M50 50V8M50 22l-9-9M50 22l9-9M50 35l-7-7M50 35l7-7"/></g></defs><g stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"><use href="#arm"/><use href="#arm" transform="rotate(60 50 50)"/><use href="#arm" transform="rotate(120 50 50)"/><use href="#arm" transform="rotate(180 50 50)"/><use href="#arm" transform="rotate(240 50 50)"/><use href="#arm" transform="rotate(300 50 50)"/></g></svg>
    <div class="eyebrow">2026 송년회</div>
    <h1>12월, 언제 모일까요?</h1>
    <p>안 되는 날만 콕콕 눌러주세요.</p>
    <div class="prog"><span id="progTxt">불러오는 중…</span><div class="bar"><i id="progBar"></i></div></div>
  </header>

  <nav class="tabs"><div class="seg" role="tablist">
    <button role="tab" id="tabInput" data-tab="input" aria-selected="true">날짜 입력</button>
    <button role="tab" id="tabResult" data-tab="result" aria-selected="false">결과 보기 <span class="cnt" id="tabCnt"></span></button>
  </div></nav>

  <div class="err" id="err" hidden><span>연결이 불안정해요.</span><button data-act="retry">다시 시도</button></div>

  <main id="viewInput">
    <section class="card">
      <h2><span class="step">1</span>내 이름 선택</h2>
      <div class="names" id="names"></div>
    </section>
    <section class="card" id="step2">
      <h2><span class="step">2</span><span id="s2t">안 되는 날 선택</span></h2>
      <p class="hint" id="s2h">먼저 위에서 이름을 골라주세요.</p>
      <div class="cal" id="cal"></div>
      <div class="calfoot"><span id="selSum"></span><button class="link" data-act="clear" id="clearBtn">전체 해제</button></div>
      <p class="tip">요일 이름을 누르면 그 요일이 한꺼번에 선택돼요.</p>
    </section>
    <button class="golink" data-tab="result">날짜별 결과 보기 →</button>
    <p class="foot">제출한 뒤에도 이름을 다시 누르면 언제든 고칠 수 있어요.</p>
  </main>

  <main id="viewResult" hidden>
    <section class="card">
      <h2>제출 현황</h2>
      <div class="big" id="rCount"></div>
      <div class="bar dark"><i id="rBar"></i></div>
      <div class="sub-h" id="waitTitle"></div>
      <div class="chips" id="waitChips"></div>
      <div class="btnrow">
        <button class="btn soft sm" data-act="nag" id="nagBtn">미제출자 알림 문구 복사</button>
        <button class="btn soft sm" data-act="link">링크 복사</button>
      </div>
      <div class="sub-h" id="doneTitle"></div>
      <div class="chips" id="doneChips"></div>
    </section>

    <section class="card">
      <h2>추천 날짜</h2>
      <p class="hint">빼고 싶은 요일은 눌러서 끄세요.</p>
      <div class="dowf" id="dowf"></div>
      <ol class="rank" id="rank"></ol>
      <button class="more" id="moreBtn" data-act="more"></button>
    </section>

    <section class="card" id="heatCard">
      <h2>한눈에 보기</h2>
      <p class="hint">날짜를 누르면 누가 안 되는지 보여요.</p>
      <div class="heat" id="heat"></div>
      <div class="legend">
        <span><i class="l0"></i>불가 0명</span><span><i class="l1"></i>1명</span><span><i class="l2"></i>2명</span><span><i class="l3"></i>3~4명</span><span><i class="l4"></i>5~7명</span><span><i class="l5"></i>8명+</span><span>★ 가장 좋은 날</span>
      </div>
      <div class="detail" id="detail"></div>
    </section>

    <section class="card">
      <details class="mxd">
        <summary>사람별 전체 표</summary>
        <div class="mxwrap"><table class="mx" id="matrix"></table></div>
      </details>
    </section>
  </main>
</div>

<div class="dock" id="dock"><div class="in"><div class="who"><b id="dockName"></b><span id="dockSub"></span></div><button class="btn primary" id="saveBtn" data-act="save">제출하기</button></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <h3 id="mTitle"></h3><p class="body" id="mBody"></p><textarea id="mText" readonly hidden></textarea>
  <div class="row"><button class="btn soft" id="mNo"></button><button class="btn primary" id="mYes"></button></div>
</div></div>
<noscript><p style="text-align:center;padding:20px">이 페이지는 자바스크립트가 필요해요.</p></noscript>

<script>
(() => {
'use strict';
const YEAR = 2026, MONTH = 11, DAYS = 31;
const HOLIDAYS = { 25: '성탄절' };
const DB = 'https://songnyeonhoe-2026-default-rtdb.asia-southeast1.firebasedatabase.app/songnyeon2026';
const SITE_URL = 'https://jtl10231-oss.github.io/songnyeonhoe/';
// 순서를 바꾸지 말고, 새 멤버는 맨 뒤에 추가 (m01~m22 번호가 저장 키)
const NAMES = ['김남수','정동환','마리오','서철우','우충기','이상봉','조병진','송보근','문병철','송현웅','서동환','김일태','심승현','여태준','박정인','박민규','이정택','홍마','박상우','서동조','문경훈','김성호'];
const MEMBERS = NAMES.map((name, i) => ({ id: 'm' + String(i + 1).padStart(2, '0'), name }))
  .sort((a, b) => a.name.localeCompare(b.name, 'ko'));
const BY_ID = {};
MEMBERS.forEach(m => { BY_ID[m.id] = m; });
const DOW = ['일','월','화','수','목','금','토'];
const FIRST = new Date(YEAR, MONTH, 1).getDay();
const ALL_DAYS = Array.from({ length: DAYS }, (_, i) => i + 1);
const dowOf = d => (FIRST + d - 1) % 7;
const dayLabel = d => `12/${d} (${DOW[dowOf(d)]})`;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const nameList = list => list.map(m => esc(m.name)).join(', ');
const level = n => n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n <= 4 ? 3 : n <= 7 ? 4 : 5;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
};

const S = {
  resp: {}, loaded: false, error: false,
  me: null, draft: new Set(), saving: false,
  tab: location.hash === '#result' ? 'result' : 'input',
  dowOn: [true, true, true, true, true, true, true],
  showAll: false, pick: null,
};
const savedMe = store.get('sn26.me');
if (savedMe && BY_ID[savedMe]) S.me = savedMe;

function parseDates(s) {
  const out = new Set();
  String(s || '').split(',').forEach(x => { const n = Number(x); if (x !== '' && Number.isInteger(n) && n >= 1 && n <= DAYS) out.add(n); });
  return out;
}
const serverDates = id => (S.resp[id] ? S.resp[id].dates : null);
function isDirty() {
  if (!S.me) return false;
  const s = serverDates(S.me);
  if (!s) return S.draft.size > 0;
  if (s.size !== S.draft.size) return true;
  for (const d of s) if (!S.draft.has(d)) return true;
  return false;
}

/* ---------- 데이터 ---------- */
let loading = false, saveSeq = 0;
async function load() {
  if (loading || S.saving) return;
  loading = true;
  const seq = saveSeq;
  try {
    const r = await fetch(DB + '/responses.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = (await r.json()) || {};
    if (seq !== saveSeq || S.saving) return;
    const dirty = isDirty();
    const next = {};
    Object.keys(data).forEach(id => {
      if (BY_ID[id] && data[id]) next[id] = { dates: parseDates(data[id].dates), at: Number(data[id].updatedAt) || 0 };
    });
    S.resp = next; S.loaded = true; S.error = false;
    if (S.me && !dirty) S.draft = new Set(serverDates(S.me) || []);
  } catch (e) {
    S.error = true;
  } finally {
    loading = false;
    render();
  }
}

async function save() {
  const id = S.me;
  if (!id || S.saving) return;
  const had = !!S.resp[id];
  if (had && !isDirty()) return;
  const dates = Array.from(S.draft).sort((a, b) => a - b);
  if (!dates.length) {
    const ok = await ask({ title: '12월 전부 가능하신가요?', body: '안 되는 날 없이 "전부 가능"으로 제출할게요.', yes: '네, 전부 가능해요', no: '다시 볼게요' });
    if (!ok) return;
  }
  S.saving = true; saveSeq++; renderDock();
  try {
    const r = await fetch(`${DB}/responses/${id}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: BY_ID[id].name, dates: dates.join(','), updatedAt: { '.sv': 'timestamp' } }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const v = (await r.json()) || {};
    S.resp[id] = { dates: parseDates(v.dates), at: Number(v.updatedAt) || Date.now() };
    S.loaded = true; S.error = false;
    toast(had ? '수정한 내용을 저장했어요. 결과 보기에서 확인하세요' : '제출 완료! 결과 보기에서 확인하세요');
  } catch (e) {
    toast('저장하지 못했어요. 잠시 후 다시 눌러주세요');
  } finally {
    S.saving = false; saveSeq++;
    render();
  }
}

/* ---------- 입력 ---------- */
async function pickName(id) {
  if (S.saving) return;
  if (id === S.me) { scrollToStep2(); return; }
  if (isDirty()) {
    const ok = await ask({ title: '저장하지 않은 선택이 있어요', body: `${BY_ID[S.me].name}님 선택을 저장하지 않고 넘어갈까요?`, yes: '넘어가기', no: '취소' });
    if (!ok) return;
  }
  S.me = id; store.set('sn26.me', id);
  S.draft = new Set(serverDates(id) || []);
  render();
  scrollToStep2();
}
function scrollToStep2() {
  const y = $('step2').getBoundingClientRect().top + window.pageYOffset - 70;
  window.scrollTo({ top: y, behavior: 'smooth' });
}
function needName() {
  toast('먼저 이름을 골라주세요');
  $('names').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function toggleDay(d) {
  if (!S.me) return needName();
  if (S.draft.has(d)) S.draft.delete(d); else S.draft.add(d);
  renderCal(); renderDock();
}
function toggleDow(w) {
  if (!S.me) return needName();
  const ds = ALL_DAYS.filter(d => dowOf(d) === w);
  const allOn = ds.every(d => S.draft.has(d));
  ds.forEach(d => { if (allOn) S.draft.delete(d); else S.draft.add(d); });
  renderCal(); renderDock();
}
function clearDraft() {
  if (!S.me || !S.draft.size) return;
  S.draft.clear(); renderCal(); renderDock();
}

/* ---------- 화면 ---------- */
function renderHero() {
  const n = Object.keys(S.resp).length, total = MEMBERS.length;
  $('progTxt').textContent = S.loaded ? `${n} / ${total}명 제출` : '불러오는 중…';
  $('tabCnt').textContent = S.loaded ? n + '명 제출' : '';
  $('progBar').style.width = (S.loaded ? (n / total) * 100 : 0) + '%';
}
function renderNames() {
  $('names').innerHTML = MEMBERS.map(m => {
    const done = !!S.resp[m.id];
    return `<button class="name${done ? ' done' : ''}" data-name="${m.id}" aria-pressed="${m.id === S.me}">${esc(m.name)}${done ? '<span class="ck" aria-label="제출함">✓</span>' : ''}</button>`;
  }).join('');
}
function renderCal() {
  const me = S.me ? BY_ID[S.me] : null;
  $('s2t').textContent = me ? `${me.name}님, 안 되는 날을 눌러주세요` : '안 되는 날 선택';
  $('s2h').textContent = !me ? '먼저 위에서 이름을 골라주세요.'
    : S.resp[S.me] ? '지난번 제출 내용이에요. 고친 뒤 저장하면 돼요.'
    : '12월 중 참석이 어려운 날을 모두 눌러주세요.';
  let h = DOW.map((w, i) => `<button class="dow${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}" data-dow="${i}" aria-label="${w}요일 전체 선택">${w}</button>`).join('');
  for (let i = 0; i < FIRST; i++) h += '<span></span>';
  ALL_DAYS.forEach(d => {
    const w = dowOf(d), no = S.draft.has(d), hol = HOLIDAYS[d];
    const cls = ['day', w === 0 ? 'sun' : w === 6 ? 'sat' : '', hol ? 'hol' : '', no ? 'no' : ''].filter(Boolean).join(' ');
    h += `<button class="${cls}" data-day="${d}" aria-pressed="${no}" aria-label="12월 ${d}일 ${DOW[w]}요일${no ? ' 안 됨' : ''}"><span class="n">${d}</span><small>${no ? '안 됨' : hol ? esc(hol) : '&nbsp;'}</small></button>`;
  });
  $('cal').innerHTML = h;
  $('cal').classList.toggle('locked', !me);
  const sel = Array.from(S.draft).sort((a, b) => a - b);
  $('selSum').innerHTML = !me ? '' : sel.length
    ? `<b>안 되는 날 ${sel.length}일</b> · ${sel.map(d => `${d}(${DOW[dowOf(d)]})`).join(', ')}`
    : '<b>선택 없음</b> · 12월 전부 가능';
  $('clearBtn').hidden = !me || !sel.length;
}
function renderDock() {
  const show = S.tab === 'input' && !!S.me;
  $('dock').classList.toggle('show', show);
  if (!S.me) return;
  const had = !!S.resp[S.me], dirty = isDirty();
  $('dockName').textContent = `${BY_ID[S.me].name}님`;
  $('dockSub').textContent = S.draft.size ? `안 되는 날 ${S.draft.size}일 선택` : '안 되는 날 없음';
  const b = $('saveBtn');
  b.disabled = S.saving || (had && !dirty);
  b.textContent = S.saving ? '저장 중…' : !had ? '제출하기' : dirty ? '수정 저장' : '제출 완료 ✓';
}

function stats() {
  const done = MEMBERS.filter(m => S.resp[m.id]);
  const wait = MEMBERS.filter(m => !S.resp[m.id]);
  const days = ALL_DAYS.map(d => {
    const no = done.filter(m => S.resp[m.id].dates.has(d));
    const ok = done.filter(m => !S.resp[m.id].dates.has(d));
    return { d, w: dowOf(d), no, ok };
  });
  return { done, wait, days };
}
function renderResult() {
  const total = MEMBERS.length;
  if (!S.loaded) {
    $('rCount').textContent = '불러오는 중…';
    ['waitTitle','waitChips','doneTitle','doneChips','rank','heat','detail','matrix'].forEach(id => { $(id).innerHTML = ''; });
    $('moreBtn').hidden = true;
    return;
  }
  const { done, wait, days } = stats();
  $('rCount').innerHTML = `<b>${done.length}</b> / ${total}명 제출`;
  $('rBar').style.width = (done.length / total) * 100 + '%';
  $('waitTitle').textContent = `아직 안 한 사람 ${wait.length}명`;
  $('waitChips').innerHTML = wait.length ? wait.map(m => `<span class="chip wait">${esc(m.name)}</span>`).join('') : '<span class="muted">모두 제출했어요!</span>';
  $('nagBtn').hidden = !wait.length;
  $('doneTitle').textContent = `제출한 사람 ${done.length}명`;
  $('doneChips').innerHTML = done.length
    ? done.map(m => `<span class="chip ok">${esc(m.name)}${S.resp[m.id].dates.size ? '' : ' <em>전부 가능</em>'}</span>`).join('')
    : '<span class="muted">아직 없어요</span>';

  // 추천 날짜
  $('dowf').innerHTML = DOW.map((w, i) => `<button data-dowf="${i}" aria-pressed="${S.dowOn[i]}">${w}</button>`).join('');
  const pool = days.filter(x => S.dowOn[x.w]).sort((a, b) => a.no.length - b.no.length || a.d - b.d);
  const ranks = [];
  pool.forEach((x, i) => { ranks[i] = i && x.no.length === pool[i - 1].no.length ? ranks[i - 1] : i + 1; });
  const best = pool.length ? pool[0].no.length : null;
  if (S.pick == null && done.length && pool.length) S.pick = pool[0].d;
  const list = S.showAll ? pool : pool.slice(0, 5);
  $('rank').innerHTML = !done.length ? '<li class="empty">아직 제출한 사람이 없어요</li>'
    : !pool.length ? '<li class="empty">요일을 하나 이상 켜주세요</li>'
    : list.map((x, i) => `<li class="${ranks[i] === 1 ? 'top' : ''}" data-pickday="${x.d}">
        <span class="rk">${ranks[i]}</span>
        <div class="rmain"><div class="rd">${dayLabel(x.d)}${HOLIDAYS[x.d] ? `<span class="tag">${esc(HOLIDAYS[x.d])}</span>` : ''}</div>
        <div class="rno${x.no.length ? '' : ' none'}">${x.no.length ? `${nameList(x.no)} 안 됨` : '안 되는 사람 없음'}</div></div>
        <div class="rok"><b>${x.ok.length}명</b>가능</div></li>`).join('');
  $('moreBtn').hidden = !done.length || pool.length <= 5;
  $('moreBtn').textContent = S.showAll ? '접기' : `전체 순위 보기 (${pool.length}일)`;

  // 한눈에 보기
  let h = DOW.map((w, i) => `<span class="dow${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${w}</span>`).join('');
  for (let i = 0; i < FIRST; i++) h += '<span></span>';
  days.forEach(x => {
    const off = !S.dowOn[x.w];
    const cls = ['hd', done.length ? 'l' + level(x.no.length) : 'lx', off ? 'off' : '', done.length && !off && x.no.length === best ? 'best' : '', S.pick === x.d ? 'sel' : ''].filter(Boolean).join(' ');
    const txt = !done.length ? '&nbsp;' : x.no.length ? `불가 ${x.no.length}` : '✓';
    h += `<button class="${cls}" data-pickday="${x.d}" aria-label="12월 ${x.d}일, 안 되는 사람 ${x.no.length}명"><span class="n">${x.d}</span><small>${txt}</small></button>`;
  });
  $('heat').innerHTML = h;

  const p = S.pick ? days[S.pick - 1] : null;
  $('detail').innerHTML = !done.length ? '<span class="muted">제출이 들어오면 날짜별로 누가 안 되는지 보여요.</span>'
    : !p ? '<span class="muted">날짜를 눌러보세요.</span>'
    : `<div class="dt">12월 ${p.d}일 ${DOW[p.w]}요일${HOLIDAYS[p.d] ? ' · ' + esc(HOLIDAYS[p.d]) : ''}</div>
       <div class="dn"><span class="g">가능 ${p.ok.length}명</span><span class="r">불가 ${p.no.length}명</span>${wait.length ? `<span class="w">미제출 ${wait.length}명</span>` : ''}</div>
       <div class="dl"><b>안 되는 사람</b><span>${p.no.length ? nameList(p.no) : '없음'}</span></div>
       <div class="dl"><b>가능한 사람</b><span>${p.ok.length ? nameList(p.ok) : '없음'}</span></div>
       ${wait.length ? `<div class="dl"><b>미제출</b><span>${nameList(wait)}</span></div>` : ''}`;

  // 사람별 전체 표
  let t = '<thead><tr><th class="nm">이름</th>' + ALL_DAYS.map(d => {
    const w = dowOf(d);
    return `<th class="${w === 0 || HOLIDAYS[d] ? 'sun' : w === 6 ? 'sat' : ''}">${d}<small>${DOW[w]}</small></th>`;
  }).join('') + '</tr></thead><tbody>';
  done.concat(wait).forEach(m => {
    const r = S.resp[m.id];
    t += `<tr class="${r ? '' : 'pending'}"><td class="nm">${esc(m.name)}${r ? '' : '<small>미제출</small>'}</td>` +
      ALL_DAYS.map(d => (r && r.dates.has(d) ? '<td class="x">✕</td>' : '<td></td>')).join('') + '</tr>';
  });
  t += '</tbody><tfoot><tr><td class="nm">불가 인원</td>' +
    days.map(x => `<td class="${done.length ? 'l' + level(x.no.length) : ''}">${done.length ? x.no.length : ''}</td>`).join('') + '</tr></tfoot>';
  $('matrix').innerHTML = t;
}

function render() {
  renderHero();
  $('tabInput').setAttribute('aria-selected', String(S.tab === 'input'));
  $('tabResult').setAttribute('aria-selected', String(S.tab === 'result'));
  $('viewInput').hidden = S.tab !== 'input';
  $('viewResult').hidden = S.tab !== 'result';
  $('err').hidden = !S.error;
  if (S.tab === 'input') { renderNames(); renderCal(); } else renderResult();
  renderDock();
}
function setTab(t) {
  if (S.tab === t) return;
  S.tab = t;
  try { history.replaceState(null, '', t === 'result' ? '#result' : location.pathname + location.search); } catch (e) { /* ignore */ }
  render();
  const top = document.querySelector('.tabs').offsetTop;
  if (window.pageYOffset > top) window.scrollTo(0, top);
  load();
}

/* ---------- 공용 ---------- */
let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
}
function ask(o) {
  return new Promise(resolve => {
    const m = $('modal'), ta = $('mText');
    $('mTitle').textContent = o.title;
    $('mBody').textContent = o.body || '';
    $('mBody').hidden = !o.body;
    ta.hidden = !o.text; ta.value = o.text || '';
    $('mYes').textContent = o.yes || '확인';
    $('mNo').textContent = o.no || '';
    $('mNo').hidden = !o.no;
    m.classList.add('show');
    const close = v => { m.classList.remove('show'); $('mYes').onclick = $('mNo').onclick = m.onclick = null; resolve(v); };
    $('mYes').onclick = () => close(true);
    $('mNo').onclick = () => close(false);
    m.onclick = e => { if (e.target === m) close(false); };
    if (o.text) setTimeout(() => { ta.focus(); ta.select(); }, 60);
  });
}
async function copy(text, okMsg) {
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { /* fallback */ }
  if (!ok) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ }
    ta.remove();
  }
  if (ok) toast(okMsg);
  else ask({ title: '길게 눌러 복사해 주세요', text, yes: '닫기' });
}
function nagText() {
  const wait = MEMBERS.filter(m => !S.resp[m.id]);
  return `[2026 송년회 날짜 정하기]\n아직 안 하신 분: ${wait.map(m => m.name).join(', ')}\n안 되는 날만 눌러주세요 → ${SITE_URL}`;
}

const actions = {
  retry: () => load(),
  clear: clearDraft,
  save: save,
  more: () => { S.showAll = !S.showAll; renderResult(); },
  nag: () => copy(nagText(), '알림 문구를 복사했어요'),
  link: () => copy(SITE_URL, '링크를 복사했어요'),
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-name],[data-day],[data-dow],[data-tab],[data-dowf],[data-pickday],[data-act]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.name) pickName(ds.name);
  else if (ds.day) toggleDay(Number(ds.day));
  else if (ds.dow) toggleDow(Number(ds.dow));
  else if (ds.tab) setTab(ds.tab);
  else if (ds.dowf) { const i = Number(ds.dowf); S.dowOn[i] = !S.dowOn[i]; renderResult(); }
  else if (ds.pickday) {
    S.pick = Number(ds.pickday); renderResult();
    if (t.closest('#rank')) $('detail').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  else if (ds.act && actions[ds.act]) actions[ds.act]();
});
window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', () => setTab(location.hash === '#result' ? 'result' : 'input'));
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 20000);

render();
load();
})();
</script>
</body>
</html>
